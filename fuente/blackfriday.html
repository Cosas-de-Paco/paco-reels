        const [x, y] = headPos(o); if (lt > 7.5) { speedLines(tt, x, y, 0.35); } }

      if (mode === 'cyber') { boom('¡BZZZ!', 820, 760, 80, '#FFFFFF', '#3FD0C9', t, T.cyber + 0.3, 0.1, 1.0); boom('CYBER MONDAY -80%', 540, 760, 86, '#FFF3B0', '#FF4D6D', t, T.cyber + 1.6, -0.05, 4.0);
        if (lt > 1.6) { const [x, y, R] = headPos(o); shockBurst(x, y, 520, tt, '#FFE14D', 0.1); } }
